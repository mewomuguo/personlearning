<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logic Lab 邏輯任務基地</title>
<meta name="description" content="為 2e 自學者設計的台灣小學常用一千字、數學、自然科學學習基地 / A bilingual self-learning hub: 1,000 common Traditional Chinese characters, math engine, science detective.">
<link rel="stylesheet" href="css/style.css?v=science-reason-20260918-1">
</head>
<body>
<div id="root"><div style="font-family:sans-serif;text-align:center;padding:60px 20px;color:#666">⏳ 載入中 Loading…<br><small>若超過 10 秒仍停在這裡,下方會出現紅色錯誤診斷,請截圖回報</small></div></div>
<script>
(function(){
  function show(msg){
    var d=document.getElementById('errbox');
    if(!d){d=document.createElement('div');d.id='errbox';
      d.style.cssText='position:fixed;left:10px;right:10px;bottom:10px;z-index:99999;background:#B3261E;color:#fff;padding:14px 16px;border-radius:12px;font:13px/1.5 monospace;max-height:40vh;overflow:auto';
      d.innerHTML='<b>⚠ 系統錯誤(請整段截圖回報)/ Error — screenshot this box</b>';
      document.body.appendChild(d);}
    var p=document.createElement('div');
    p.textContent=msg;d.appendChild(p);
  }
  var loadingTimer=setTimeout(function(){
    var root=document.getElementById('root');
    if(root && root.textContent.indexOf('Loading…')>=0) show('載入超過10秒，請檢查網路後重新整理。 / Loading is taking longer than expected. Please check your connection and reload.');
  },10000);
  window.addEventListener('error',function(e){
    if(e.target && e.target.tagName==='SCRIPT') {show('程式資源載入失敗，請重新整理。 / A script failed to load: '+e.target.src);return;}

    show((e.message||'unknown')+'  @'+String(e.filename||'').split('/').pop()+':'+(e.lineno||'?'));
  },true);
  window.addEventListener('unhandledrejection',function(e){show('Promise: '+String(e.reason))});
})();
</script>

</body>
